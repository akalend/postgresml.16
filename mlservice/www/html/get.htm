<!doctype html>
<html>
<head>
	<title>Database console</title>
	<meta charset="utf-8">
	<link rel="stylesheet" href="bootstrap.min.css" integrity="sha384-rwoIResjU2yc3z8GV/NPeZWAv56rSmLldC3R/AZzGRnGxQQKnKkoFVhFQhNUwEyJ" crossorigin="anonymous">
	<link href="main.css" rel="stylesheet">
	<script 
		src="jquery-3.6.3.js"
		integrity="sha256-nQLuAZGRRcILA+6dMBOvcRh5Pe310sBpanc6+QBmyVM="
		crossorigin="anonymous">
	</script>

</head>
<body>
		<form class="card p-2" action="/run" method="GET">
			<div class="input-group">	
				<div class="container">
		<section class="console-reference">
		 <button id="runBtn" class="btn btn-primary btn-lg btn-block" type="submit">Запустить БД</button> 
		 </section>
		</div>
	</form>

	<script language="javascript">
		var btn = document.getElementById("runBtn");

		function sessionCount() {
			$.ajax({
					type: "GET",
					url: "/sessions",
					headers: {
						'X-Token': getCookie('token')
					},
					success:function(data){
						console.log("sessions: " + data.count)
						if (data.count > 3) {
							console.log('disabled')
							btn.disabled = true;
						} 
					}
			});
		}

	sessionCount();

	function getCookie(name) {
		const value = `; ${document.cookie}`;
		const parts = value.split(`; ${name}=`);
		if (parts.length === 2) return parts.pop().split(';').shift();
	}

	</script>

</body>
</html>
