<!doctype html>
<html>
<head>
	<title>Database console</title>
	<meta charset="utf-8">
	<link rel="stylesheet" href="bootstrap.min.css" integrity="sha384-rwoIResjU2yc3z8GV/NPeZWAv56rSmLldC3R/AZzGRnGxQQKnKkoFVhFQhNUwEyJ" crossorigin="anonymous">
	<link href="main.css" rel="stylesheet">
	<script 
		src="jquery-3.6.3.js"
		integrity="sha256-nQLuAZGRRcILA+6dMBOvcRh5Pe310sBpanc6+QBmyVM="
		crossorigin="anonymous">
	</script>
</head>
<body onUnload="">
	<div  id="queryForm"  class="container-xxl" > 
		<!-- hidden="true" -->
		<div class="form-group">
		<section class="console-reference" >
			<textarea  class="form-control" id="responce" disabled  style="font-family: monospace; height: 300px; "></textarea>
			<button id="queryBtn" type="button" class="btn btn-primary">SEND QUERY</button>
			<textarea  class="form-control" style="font-family: monospace;"   id="query" ></textarea>
			</section>
		</div>
	</div>
	<div class="mb-3">
	  <label for="formFile" class="form-label">Загрузите файл</label>
	  <input class="form-control" type="file" id="formFile">
	  <button id="uploadBtn" type="button" class="btn btn-primary">UPLOAD FILE</button>
	  <div id="status"></div>
	</div>
	<script language="javascript">
		var id = window.location.hash.substring(1);
		var queryForm = document.getElementById("queryForm");
		var responce = document.getElementById("responce");
		var queryBtn = document.getElementById("queryBtn");
		var uploadBtn = document.getElementById("uploadBtn");
		queryBtn.addEventListener("click", sendQuery);
		uploadBtn.addEventListener("click", uploadQuery);

		var query = document.getElementById("query");
		let timerId = setInterval(checkDb, 10000); // 1 min

		function checkDb() {
			var data = '{"id":"' + id + '"}';
			$.ajax({
				  type: "POST",
				  url: "/checkdb",
				  data : data,
				  dataType: "json",
				  contentType:"application/json",
				  success: function(data){
					console.log( data);
				  },
				  error: function(err){
					console.log(err)
				  }
			});
		}

		function runDocker() {
			console.log("send run");
			$.ajax({
				  type: "POST",
				  url: "/run",
				  data : '',
				  success: function(data){
					id = data.id;

					console.log( "responce");
					console.log( data);
					queryForm.hidden = false;	  	
				  },
				  error: function(err){
					console.log(err)
				  },
				  dataType: "json",
			});
		}

		function uploadQuery() {
			var fileInput = document.getElementById("formFile");
			console.log("send run");
			if (fileInput.files.length === 0) {
				$('#status').text('Please select a file first.');
				return;
			}
			var file = fileInput.files[0];
			var formData = new FormData();
			formData.append('file', file);

			$('#status').text('Uploading...');
			console.log(formData);
			$.ajax({
			  type: "POST",
			  url: "/upload",
			  data: formData,
			  processData: false,
			  contentType: false,
			  success: function(data){
				console.log(data);
				$('#status').text('Upload Ok');
			  },
			  error: function(xhr, status, error){
				$('#status').text('Uploading is error:' + error);
				console.log('error code' +status)
			  },
			  async: true
			});
		}

		function sendQuery() {
			console.log("upload");
			var data = '{ "query":"' + query.value + '","id":"' + id + '"}';
			console.log(data)
			$.ajax({
				  type: "POST",
				  url: "/psql",
				  data : data,
				  success: function(data){
					console.log(data);
					responce.value = query.value + "\n" +data;
					query.value = ""; 	
				  },
				  error: function(err,code){
					console.log(code)
				  },
				  contentType:"application/json",
				  async: true,
				  dataType: "text"
			});
		}

		function getCookie(name) {
			const value = `; ${document.cookie}`;
			const parts = value.split(`; ${name}=`);
			if (parts.length === 2) return parts.pop().split(';').shift();
		}

	</script>

</body>
</html>
